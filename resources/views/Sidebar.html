<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .mermaid g.node { cursor: pointer !important; }
  </style>
</head>
<body class="p-4 custom-scroll">
  <div class="mb-4 flex items-center justify-between border-b border-slate-700 pb-2">
    <h2 class="text-lg font-bold text-cyan-400">⚡ gemini-bpms-portal</h2>
    <span class="rounded bg-emerald-500/20 px-2 py-0.5 text-xs text-emerald-400">Online</span>
  </div>

  <!-- Mermaid フロー描画領域 -->
  <div class="mb-4 rounded-lg bg-slate-900/80 p-3 border border-slate-800">
    <h3 class="mb-2 text-xs font-semibold text-slate-400">🔄 リアルタイム業務フロー</h3>
    <div id="mermaid-container" class="mermaid overflow-x-auto text-center">
      graph TD
        A["👤 質問/指示入力"] --> B["⚡ Supabase Realtime"]
        B --> C["🧠 Gemini AI Studio"]
        C --> D["📊 Mermaid描画 & 応答"]
    </div>
  </div>

  <!-- そこだけView エラー補正カード -->
  <div id="sokodake-view" class="mb-4 rounded-lg border border-pink-500/30 bg-pink-950/20 p-3">
    <div class="mb-1 text-xs font-bold text-pink-400">⚠️ 入力不備を自動検知（前段補正）</div>
    <p id="error-detail" class="text-xs text-slate-300 mb-2">設定パラメータの欠落があります（例: MetaピクセルID）。</p>
    <button onclick="fixError()" class="w-full rounded bg-pink-600 py-1 text-xs font-bold text-white hover:bg-pink-500">
      ワンタップで前段へアラート通知送信 📩
    </button>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });

    function fixError() {
      google.script.run.sendGoogleChatAlert("ユーザーが『そこだけView』より補正アラートを送信しました。");
      document.getElementById('sokodake-view').classList.add('hidden');
      alert("前段担当者へ補正アラートを送信しました！");
    }
  </script>
</body>
</html>
